<title>Nexus Intelligence Brand Book</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Manual de marca da Nexus Intelligence: símbolo, logotipo, cor, tipografia e aplicações. Documento de uso interno.">
<link rel="icon" type="image/svg+xml" href="svg/favicon-escuro.svg">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: navegação lateral fixa + capítulos largos em coluna única, painéis de peça como "bancadas" */
:root{
  --noite:#0A0B1E; --sup:#14152B; --sup2:#1B1D3A; --texto:#F4F5FA; --apoio:#9AA0BA; --linha:#2A2C4D;
  --violeta:#8B6DFF; --aqua:#22D8E8; --rosa:#FF4FB8;
  --papel:#FFFFFF; --tinta:#0A0B1E; --v-esc:#5A3FD6; --a-esc:#0B7F8F; --r-esc:#C21F86; --apoio-c:#4B4F6B; --linha-c:#D9DBE8;
  --ok:#2EC27E; --atencao:#F2B84B; --critico:#F0545B;
  --f-display:'Sora',system-ui,'Segoe UI',sans-serif;
  --f-text:'Inter',system-ui,'Segoe UI',sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
  --nav:252px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:20px}
body{background:var(--noite);color:var(--texto);font:16px/1.65 var(--f-text);-webkit-font-smoothing:antialiased;overflow-x:hidden}
svg{display:block;max-width:100%;height:auto}
a{color:var(--aqua)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--aqua);outline-offset:3px;border-radius:4px}

/* ---------- navegação */
.nav{position:fixed;inset:0 auto 0 0;width:var(--nav);background:var(--noite);border-right:1px solid var(--linha);
  padding:26px 18px 26px max(22px,env(safe-area-inset-left,0px));overflow-y:auto;z-index:20;display:flex;flex-direction:column;gap:24px}
.nav .marca{width:178px}
.nav ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;gap:10px;align-items:baseline;padding:7px 10px;border-radius:8px;color:var(--apoio);text-decoration:none;font-size:14px;line-height:1.35}
.nav a b{font:500 11px var(--f-mono);color:var(--apoio);opacity:.7;min-width:20px}
.nav a:hover{color:var(--texto);background:var(--sup)}
.nav a.on{color:var(--texto);background:var(--sup);box-shadow:inset 2px 0 0 var(--violeta)}
.nav .rod{margin-top:auto;font:400 11px/1.5 var(--f-mono);color:var(--apoio)}
main{margin-left:var(--nav)}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}

/* ---------- tipografia da página */
h1,h2,h3,h4{font-family:var(--f-display);margin:0;text-wrap:balance}
h2{font-weight:600;font-size:clamp(28px,4vw,42px);line-height:1.1;letter-spacing:-.02em}
h3{font-weight:600;font-size:20px;line-height:1.25;letter-spacing:-.01em;margin-top:44px}
h4{font:500 12px/1.4 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--apoio);margin:30px 0 12px}
p{margin:0 0 14px;max-width:68ch}
.lead{font-size:19px;line-height:1.6;color:#C9CDE0;max-width:62ch}
.eb{font:500 12px var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--aqua);display:block;margin-bottom:14px}
.mono{font-family:var(--f-mono)}
.mut{color:var(--apoio)}
.cap{padding-block:84px;border-top:1px solid var(--linha)}
.cap>.wrap>header{margin-bottom:34px;display:flex;flex-direction:column;gap:10px}
ul.pts{margin:0 0 14px;padding-left:20px;max-width:68ch}
ul.pts li{margin-bottom:6px}
code{font:500 .88em var(--f-mono);background:var(--sup);border:1px solid var(--linha);padding:1px 6px;border-radius:5px}

/* ---------- blocos */
.g2,.g3,.g4{display:grid;gap:18px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr))}
.g2>*,.g3>*,.g4>*{min-width:0}
.card{background:var(--sup);border:1px solid var(--linha);border-radius:14px;padding:22px}
.card h3{margin-top:0;font-size:18px}
.stage{border-radius:12px;display:grid;place-items:center;padding:28px;background:var(--noite);border:1px solid var(--linha);min-width:0;position:relative;overflow:hidden}
.stage.sup{background:var(--sup)}
.stage.papel{background:var(--papel);border-color:var(--linha-c);color:var(--tinta)}
.stage.preto{background:#000}
.stage.branco{background:#fff;border-color:var(--linha-c)}
.stage.violeta{background:var(--violeta);border-color:transparent}
.stage.foto{background:repeating-linear-gradient(35deg,#3b2f5a 0 14px,#d9a36a 14px 30px,#2d5b6b 30px 44px,#e8d9c2 44px 60px);border-color:transparent}
fig,figure{margin:0;min-width:0}
figcaption{font:400 12px/1.5 var(--f-mono);color:var(--apoio);margin-top:10px}
.stage.papel+figcaption{color:var(--apoio)}
.tw{overflow-x:auto;border:1px solid var(--linha);border-radius:12px;background:var(--sup)}
table.tb{width:100%;border-collapse:collapse;font-size:14px;min-width:560px}
.tb th{font:500 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--apoio);text-align:left;padding:12px 14px;border-bottom:1px solid var(--linha);white-space:nowrap}
.tb td{padding:11px 14px;border-bottom:1px solid var(--linha);vertical-align:top}
.tb tr:last-child td{border-bottom:0}
.tb td.n{font:500 13px var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.tb .sq{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-2px;margin-right:8px;border:1px solid rgba(255,255,255,.18)}
.pill{display:inline-block;font:500 11px var(--f-mono);letter-spacing:.04em;padding:2px 9px;border-radius:99px;border:1px solid}
.pill.ok{color:var(--ok);border-color:var(--ok)}
.pill.no{color:var(--critico);border-color:var(--critico)}
.pill.am{color:var(--atencao);border-color:var(--atencao)}
.dl{display:grid;grid-template-columns:minmax(120px,190px) 1fr;gap:0;border:1px solid var(--linha);border-radius:12px;overflow:hidden;background:var(--sup)}
.dl dt,.dl dd{margin:0;padding:14px 18px;border-bottom:1px solid var(--linha)}
.dl dt{font:500 12px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--apoio);background:rgba(255,255,255,.02)}
.dl dt:nth-last-of-type(1),.dl dd:last-of-type{border-bottom:0}
.regra{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start;padding:14px 0;border-bottom:1px solid var(--linha)}
.regra:last-child{border-bottom:0}
.regra .tag{font:500 11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:6px;border:1px solid;margin-top:3px}
.regra .tag.sim{color:var(--ok);border-color:var(--ok)}
.regra .tag.nao{color:var(--critico);border-color:var(--critico)}
.regra p{margin:0}

/* ---------- cor */
.sw{border:1px solid var(--linha);border-radius:12px;overflow:hidden;background:var(--sup);display:flex;flex-direction:column;min-width:0}
.sw .c{height:92px;display:flex;align-items:flex-end;padding:10px 12px;font:500 12px var(--f-mono)}
.sw .i{padding:12px 14px 14px;display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--apoio)}
.sw .i b{font:600 15px var(--f-display);color:var(--texto)}
.sw .i button{all:unset;cursor:pointer;font:500 12px var(--f-mono);color:var(--aqua);align-self:flex-start;margin-top:4px;border-bottom:1px dashed var(--aqua)}
.sw .i button:focus-visible{outline:2px solid var(--aqua);outline-offset:3px}
.sw.light{background:#fff;border-color:var(--linha-c)}
.sw.light .i{color:var(--apoio-c)}
.sw.light .i b{color:var(--tinta)}
.sw.light .i button{color:var(--a-esc);border-color:var(--a-esc)}
.barra{display:flex;height:54px;border-radius:10px;overflow:hidden;border:1px solid var(--linha);font:500 12px var(--f-mono)}
.barra div{display:flex;align-items:center;padding-left:12px;white-space:nowrap;overflow:hidden}
.cvd{display:grid;grid-template-columns:110px repeat(6,1fr);gap:6px;align-items:center;font:500 11px var(--f-mono);color:var(--apoio)}
.cvd span.q{height:30px;border-radius:5px;border:1px solid rgba(255,255,255,.12)}
.cvd.claro span.q{border-color:rgba(0,0,0,.14)}

/* ---------- peças simuladas */
.cq{container-type:inline-size}
.flex{display:flex;gap:18px;flex-wrap:wrap;align-items:center}
.escala{display:flex;flex-direction:column;gap:16px}
.escala input[type=range]{width:100%;accent-color:#8B6DFF}
.hero{padding-block:72px 64px}
.hero .wrap{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:40px;align-items:center}
.hero h1{font-weight:600;font-size:clamp(38px,6vw,68px);line-height:1.02;letter-spacing:-.03em}
.hero .meta{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px}
.hero .meta span{font:500 12px var(--f-mono);color:var(--apoio);border:1px solid var(--linha);border-radius:99px;padding:5px 12px}
@media (max-width:980px){
  :root{--nav:0px}
  .nav{position:sticky;top:env(safe-area-inset-top,0px);inset:auto;width:auto;height:auto;flex-direction:row;align-items:center;gap:14px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));overflow-x:auto;overflow-y:hidden;border-right:0;border-bottom:1px solid var(--linha)}
  .nav .marca{width:128px;flex:none}
  .nav ol{flex-direction:row;gap:2px}
  .nav a{white-space:nowrap;padding:6px 9px}
  .nav a b{display:none}
  .nav .rod{display:none}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--noite);z-index:30}
  main{margin-left:0}
  .wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .hero .wrap{grid-template-columns:1fr}
  .cap{padding-block:60px}
  .dl{grid-template-columns:1fr}
  .dl dt{border-bottom:0;padding-bottom:0}
  .cvd{grid-template-columns:70px repeat(6,1fr)}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
